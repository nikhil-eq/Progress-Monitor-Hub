name: Trigger Website Every 5 Hours

on:
  schedule:
    # Runs every 5 hours at minute 0
    - cron: '0 */5 * * *'
  workflow_dispatch:  # allows manual trigger too

jobs:
  ping:
    runs-on: ubuntu-latest

    steps:

      - name: Trigger PRJM Tracker
        run: curl -s -o /dev/null -w "%{http_code}" https://progress-monitor-app-ayr9am56uqpmzrjfzyqkam.streamlit.app/

      - name: Trigger PRJM Tracker with retry
        uses: nick-fields/retry@v3
        with:
          timeout_seconds: 30
          max_attempts: 3
          command: curl -f https://progress-monitor-app-ayr9am56uqpmzrjfzyqkam.streamlit.app/

      